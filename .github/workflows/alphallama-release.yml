# Release binaries of AlphaLlama v2.
#
# Run it from the Actions tab (workflow_dispatch) to get the packages as workflow artifacts, or push a tag v* to
# also attach them to a draft GitHub release. Every package carries BUILD_INFO (commit, toolkit, architectures,
# build options), the license files, and a .sha256 next to it.
#
# Packages:
#   linux-x64-cuda12     CUDA 12.8, RTX 20-series (PTX) through RTX 50-series, AlphaInfer on sm_80 and newer
#   win-x64-cuda12       CUDA 12.4, RTX 20-series (PTX) through RTX 40-series and H100, driver 551 or newer
#   win-x64-cuda13       CUDA 13.1, RTX 20-series through RTX 50-series, driver 580 or newer
#   win-x64-vulkan       any GPU with a Vulkan 1.2 driver (NVIDIA, AMD, Intel)
#   win-x64-cpu          x86-64 with AVX2
#   win-arm64-cpu        Windows on ARM (Snapdragon X and similar)
#   macos-arm64          Apple Silicon, Metal; macOS 12 or newer
#   macos-x64            Intel Mac, CPU only; macOS 12 or newer
# The Windows and macOS packages do not include the AlphaInfer engine (Linux only); alphallama-serve uses its built-in
# engine there.

name: AlphaLlama release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  PKG: alphallama-v2

jobs:
  linux-cuda:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    env:
      ARCHS: '75-virtual;80-virtual;86-real;89-real;90-real;120a-real'
    steps:
      - name: Tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git ca-certificates python3-pip patchelf zstd file
          pip3 install -q "cmake==3.28.*" ninja

      - uses: actions/checkout@v4

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=ON -DALPHA_ALPHAINFER=ON -DGGML_CUDA_NCCL=OFF \
            -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON \
            -DCMAKE_CUDA_ARCHITECTURES="$ARCHS" -DBUILD_SHARED_LIBS=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_CURL=OFF \
            -DCMAKE_EXE_LINKER_FLAGS=-Wl,--allow-shlib-undefined -DCMAKE_SHARED_LINKER_FLAGS=-Wl,--allow-shlib-undefined \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
          # 2 jobs: with one per CPU, nvcc compiling six architectures ran the 16 GB runner out of memory
          cmake --build build -j 2

      - name: Package
        run: |
          N="$PKG-linux-x64-cuda12"; R="dist/$N"
          mkdir -p "$R/bin" "$R/licenses"
          cp -P build/bin/* "$R/bin/"
          rm -f "$R"/bin/test-* "$R"/bin/*.a
          for l in cudart cublas cublasLt; do cp -P /usr/local/cuda/lib64/lib$l.so* "$R/bin/"; done
          for f in "$R"/bin/*; do
            [ -L "$f" ] && continue
            file -b "$f" | grep -q ELF && patchelf --set-rpath '$ORIGIN' "$f"
          done
          cp LICENSE NOTICE README.md "$R/"
          cp -r licenses/. "$R/licenses/"
          cp alphainfer/LICENSE "$R/licenses/LICENSE-alphainfer"
          cp tools/serve/LICENSE "$R/licenses/LICENSE-alphaserve"
          [ -f /usr/local/cuda/EULA.txt ] && cp /usr/local/cuda/EULA.txt "$R/licenses/NVIDIA-CUDA-EULA.txt"
          {
            echo "AlphaLlama v2, $N"
            echo "source: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY commit $GITHUB_SHA"
            echo "toolkit: CUDA $(nvcc --version | grep -o 'release [0-9.]*' | cut -d' ' -f2), image nvidia/cuda:12.8.1-devel-ubuntu22.04"
            echo "cuda architectures: $ARCHS (AlphaInfer: 80 and newer)"
            echo "build options: GGML_CUDA=ON ALPHA_ALPHAINFER=ON GGML_CUDA_NCCL=OFF GGML_NATIVE=OFF BUILD_SHARED_LIBS=ON"
            echo "cpu baseline: x86-64 with AVX2, FMA, F16C, BMI2"
            echo "bundled: CUDA runtime, cuBLAS, cuBLASLt (NVIDIA CUDA Toolkit EULA, licenses/NVIDIA-CUDA-EULA.txt)"
            echo "needs: NVIDIA driver 525 or newer (570 or newer for RTX 20-series, which runs from PTX, and RTX 50-series), glibc 2.35 or newer"
          } > "$R/BUILD_INFO"
          cd dist
          tar -cf - "$N" | zstd -T0 -19 -q > "$N.tar.zst"
          sha256sum "$N.tar.zst" > "$N.tar.zst.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-cuda12
          path: dist/*.tar.zst*

  windows-cuda:
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: '12.4'
            tag: cuda12
            archs: '75-virtual;80-virtual;86-real;89-real;90-real'
            driver: '551 or newer'
          - cuda: '13.1'
            tag: cuda13
            archs: '75-virtual;80-virtual;86-real;89-real;90-real;100-real;120-real'
            driver: '580 or newer'
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA ${{ matrix.cuda }}
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ matrix.cuda }}

      - name: Install Ninja
        run: choco install ninja -y

      - name: Build
        shell: cmd
        env:
          CFLAGS: /utf-8
          CXXFLAGS: /utf-8
          CUDAFLAGS: -Xcompiler /utf-8
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ^
            -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES="${{ matrix.archs }}" ^
            -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON ^
            -DALPHA_FLASHINFER=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF || exit /b 1
          cmake --build build -j %NUMBER_OF_PROCESSORS% || exit /b 1

      - name: Package
        shell: pwsh
        run: |
          $n = "$env:PKG-win-x64-${{ matrix.tag }}"; $r = "dist\$n"
          New-Item -ItemType Directory -Force "$r\licenses" | Out-Null
          Get-ChildItem build\bin -File -Include *.exe,*.dll -Recurse | Where-Object { $_.Name -notlike 'test-*' } | Copy-Item -Destination $r
          Get-ChildItem $env:CUDA_PATH -Recurse -Include cudart64_*.dll,cublas64_*.dll,cublasLt64_*.dll | Copy-Item -Destination $r
          $redist = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -Directory | Where-Object { $_.Name -match '^\d' } | Sort-Object Name | Select-Object -Last 1
          Copy-Item "$($redist.FullName)\x64\Microsoft.VC143.CRT\*.dll", "$($redist.FullName)\x64\Microsoft.VC143.OpenMP\*.dll" $r
          Copy-Item LICENSE, NOTICE, README.md $r
          Copy-Item licenses\* "$r\licenses" -Recurse
          Copy-Item tools\serve\LICENSE "$r\licenses\LICENSE-alphaserve"
          if (Test-Path "$env:CUDA_PATH\LICENSE") { Copy-Item "$env:CUDA_PATH\LICENSE" "$r\licenses\NVIDIA-CUDA-LICENSE.txt" }
          @(
            "AlphaLlama v2, $n"
            "source: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY commit $env:GITHUB_SHA"
            "toolkit: CUDA ${{ matrix.cuda }}, MSVC $($redist.Name)"
            "cuda architectures: ${{ matrix.archs }}"
            "build options: GGML_CUDA=ON GGML_NATIVE=OFF ALPHA_FLASHINFER=OFF (no AlphaInfer on Windows)"
            "cpu baseline: x86-64 with AVX2, FMA, F16C"
            "bundled: CUDA runtime, cuBLAS, cuBLASLt (NVIDIA CUDA Toolkit EULA), Visual C++ runtime and OpenMP"
            "needs: NVIDIA driver ${{ matrix.driver }}, Windows 10 or 11 x64"
          ) | Set-Content "$r\BUILD_INFO"
          Compress-Archive -Path $r -DestinationPath "dist\$n.zip"
          "$((Get-FileHash "dist\$n.zip" -Algorithm SHA256).Hash.ToLower())  $n.zip" | Set-Content "dist\$n.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: win-x64-${{ matrix.tag }}
          path: dist/*.zip*

  windows-cpu:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      VULKAN_VERSION: 1.4.313.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: x64-cpu
            arch: x64
            vcvars: x64
            defines: '-DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON'
            info: 'x86-64 with AVX2, FMA, F16C (MSVC)'
          - tag: x64-vulkan
            arch: x64
            vcvars: x64
            defines: '-DGGML_VULKAN=ON -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON'
            info: 'x86-64 with AVX2, FMA, F16C (MSVC); GPU through Vulkan 1.2 or newer'
          - tag: arm64-cpu
            arch: arm64
            vcvars: amd64_arm64
            defines: '-DCMAKE_TOOLCHAIN_FILE=cmake/arm64-windows-llvm.cmake -DGGML_NATIVE=OFF'
            info: 'ARMv8.7-A (Snapdragon X class), clang'
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        if: matrix.tag == 'x64-vulkan'
        shell: pwsh
        run: |
          curl.exe -o "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" -L "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\bin"

      - name: Install Ninja
        run: choco install ninja -y

      - name: Build
        shell: cmd
        env:
          CFLAGS: ${{ matrix.arch == 'x64' && '/utf-8' || '' }}
          CXXFLAGS: ${{ matrix.arch == 'x64' && '/utf-8' || '' }}
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars }}
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF ${{ matrix.defines }} ^
            -DALPHA_FLASHINFER=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF || exit /b 1
          cmake --build build -j %NUMBER_OF_PROCESSORS% || exit /b 1

      - name: Package
        shell: pwsh
        run: |
          $n = "$env:PKG-win-${{ matrix.tag }}"; $r = "dist\$n"
          New-Item -ItemType Directory -Force "$r\licenses" | Out-Null
          Get-ChildItem build\bin -File -Include *.exe,*.dll -Recurse | Where-Object { $_.Name -notlike 'test-*' } | Copy-Item -Destination $r -Force
          $redist = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -Directory | Where-Object { $_.Name -match '^\d' } | Sort-Object Name | Select-Object -Last 1
          $a = "${{ matrix.arch }}"
          Copy-Item "$($redist.FullName)\$a\Microsoft.VC143.CRT\*.dll" $r
          if ($a -eq 'x64') { Copy-Item "$($redist.FullName)\x64\Microsoft.VC143.OpenMP\*.dll" $r }
          else { Copy-Item "$($redist.FullName)\debug_nonredist\arm64\Microsoft.VC143.OpenMP.LLVM\libomp140.aarch64.dll" $r }
          Copy-Item LICENSE, NOTICE, README.md $r
          Copy-Item licenses\* "$r\licenses" -Recurse
          Copy-Item tools\serve\LICENSE "$r\licenses\LICENSE-alphaserve"
          @(
            "AlphaLlama v2, $n"
            "source: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY commit $env:GITHUB_SHA"
            "toolkit: MSVC $($redist.Name)"
            "build options: GGML_CUDA=OFF ${{ matrix.defines }} (no AlphaInfer on Windows)"
            "cpu baseline: ${{ matrix.info }}"
            "bundled: Visual C++ runtime and OpenMP"
            "needs: Windows 10 or 11, ${{ matrix.arch }}"
          ) | Set-Content "$r\BUILD_INFO"
          Compress-Archive -Path $r -DestinationPath "dist\$n.zip"
          "$((Get-FileHash "dist\$n.zip" -Algorithm SHA256).Hash.ToLower())  $n.zip" | Set-Content "dist\$n.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: win-${{ matrix.tag }}
          path: dist/*.zip*

  macos:
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: arm64
            runner: macos-14
            arch: arm64
            ssl_target: darwin64-arm64-cc
            defines: '-DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON'
            info: 'Apple Silicon, GPU through Metal'
          - tag: x64
            runner: macos-15-intel
            arch: x86_64
            ssl_target: darwin64-x86_64-cc
            defines: '-DGGML_METAL=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON'
            info: 'Intel, CPU only (AVX2, FMA, F16C)'
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      # latest 3.5 LTS release; it is linked statically, so a security release means a rebuild (bump both lines)
      OPENSSL_VERSION: '3.5.9'
      OPENSSL_SHA256: '603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a'
    steps:
      - uses: actions/checkout@v4

      # Homebrew's static OpenSSL is built for the runner's own macOS, so a 12.0 binary linked against it would carry
      # newer-OS calls; build it for 12.0 instead.
      - name: OpenSSL for macOS 12
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o ossl.tar.gz "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz"
          echo "$OPENSSL_SHA256  ossl.tar.gz" | shasum -a 256 -c -
          tar xzf ossl.tar.gz && cd "openssl-$OPENSSL_VERSION"
          ./Configure ${{ matrix.ssl_target }} no-shared no-tests no-docs -mmacosx-version-min=12.0 --prefix="$RUNNER_TEMP/ssl" --libdir=lib
          make -j "$(sysctl -n hw.ncpu)" build_libs > /dev/null
          make install_dev > /dev/null

      - name: Build
        run: |
          SSL="$RUNNER_TEMP/ssl"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF ${{ matrix.defines }} \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_OPENSSL=ON -DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_ROOT_DIR="$SSL" \
            -DOPENSSL_INCLUDE_DIR="$SSL/include" -DOPENSSL_CRYPTO_LIBRARY="$SSL/lib/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="$SSL/lib/libssl.a"
          cmake --build build -j "$(sysctl -n hw.ncpu)"

      - name: Package
        run: |
          N="$PKG-macos-${{ matrix.tag }}"; R="dist/$N"
          mkdir -p "$R/bin" "$R/licenses"
          for f in build/bin/*; do
            [ -f "$f" ] && [ -x "$f" ] || continue
            case "$(basename "$f")" in test-*) continue ;; esac
            file -b "$f" | grep -q "Mach-O" || continue
            # nothing outside /System and /usr/lib may be linked: users have no Homebrew
            if otool -L "$f" | tail -n +2 | grep -v -E '^\s*(/System/Library/|/usr/lib/)'; then
              echo "ERROR: $f links non-system libraries (above)"; exit 1
            fi
            minos=$(otool -l "$f" | awk '/LC_BUILD_VERSION/{b=1} b && /minos/{print $2; exit}')
            [ "$minos" = "12.0" ] || { echo "ERROR: $f has minimum macOS $minos, not 12.0"; exit 1; }
            cp "$f" "$R/bin/"
            # ad-hoc signature: Apple Silicon refuses unsigned code (not a Developer ID signature)
            codesign --force --sign - "$R/bin/$(basename "$f")"
          done
          cp LICENSE NOTICE README.md "$R/"
          cp -r licenses/. "$R/licenses/"
          cp tools/serve/LICENSE "$R/licenses/LICENSE-alphaserve"
          printf '%s\n' "AlphaLlama v2 for macOS 12 or newer (${{ matrix.info }})" "" \
            "Run:  bin/alphallama-serve -m <model.gguf>     or  bin/alphallama -m <model.gguf>" "" \
            "If macOS says a program \"cannot be opened\" or \"is damaged\" after downloading," \
            "clear the download quarantine flag once, in this folder:" \
            "  xattr -dr com.apple.quarantine ." > "$R/README-macos.txt"
          {
            echo "AlphaLlama v2, $N"
            echo "source: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY commit $GITHUB_SHA"
            echo "toolkit: $(clang --version | head -1), macOS SDK $(xcrun --show-sdk-version), deployment target 12.0"
            echo "build options: BUILD_SHARED_LIBS=OFF GGML_NATIVE=OFF ${{ matrix.defines }} OpenSSL static (no AlphaInfer on macOS)"
            echo "target: ${{ matrix.info }}"
            echo "bundled: OpenSSL $OPENSSL_VERSION (static, built for macOS 12.0); links only macOS system libraries"
            echo "needs: macOS 12 or newer, ${{ matrix.arch }}"
          } > "$R/BUILD_INFO"
          cd dist
          tar -czf "$N.tar.gz" "$N"
          shasum -a 256 "$N.tar.gz" > "$N.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.tag }}
          path: dist/*.tar.gz*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-cuda, windows-cuda, windows-cpu, macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "AlphaLlama v2 ($GITHUB_REF_NAME)" --notes "Binaries built by the AlphaLlama release workflow from $GITHUB_SHA."
